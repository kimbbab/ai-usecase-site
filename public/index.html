<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>콘텐츠본부 AI 활용 사례</title><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}</style></head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url("fonts/PretendardVariable.woff2") format("woff2-variations"),url("fonts/PretendardVariable.woff2") format("woff2")}
/* 레이아웃: 상단 탭 → 좌우로 넘기는 대표 글 → (필터+목록 | 오른쪽 AI 도우미). 흰색·회색 바탕, 파랑은 버튼에만. 글꼴 Pretendard */
:root{
  --bg:#ffffff; --soft:#f6f7f8; --card:#ffffff; --ink:#111316; --sub:#5e646e; --faint:#9298a2; --line:#e8eaed;
  --green:#2b44c7; --green-soft:#f3f4f6; --ok:#15884a; --ok-soft:#e7f5ee; --mark:#ffe46b; --heart:#e5484d; --orange:#e2611b; --amber:#c98a00; --seg:#111316; --seg-ink:#ffffff; --go-ink:#ffffff;
  --shadow:0 1px 2px rgba(17,19,22,.04),0 8px 24px -16px rgba(17,19,22,.18);
  --serif:var(--f);
  --f:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:var(--f);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1113; --soft:#16191c; --card:#15181b; --ink:#eef0f2; --sub:#a4aab3; --faint:#6f7680; --line:#262a2f;
  --green:#93a5ff; --green-soft:rgba(255,255,255,.05); --ok:#4cc986; --ok-soft:rgba(76,201,134,.12); --mark:#6e5c10; --heart:#ff6b70; --orange:#ff8a4c; --amber:#e9b440; --seg:#eef0f2; --seg-ink:#0f1113; --go-ink:#0b1030;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1113; --soft:#16191c; --card:#15181b; --ink:#eef0f2; --sub:#a4aab3; --faint:#6f7680; --line:#262a2f;
  --green:#93a5ff; --green-soft:rgba(255,255,255,.05); --ok:#4cc986; --ok-soft:rgba(76,201,134,.12); --mark:#6e5c10; --heart:#ff6b70; --orange:#ff8a4c; --amber:#e9b440; --seg:#eef0f2; --seg-ink:#0f1113; --go-ink:#0b1030;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
a{color:var(--ink);text-underline-offset:3px}
.wrap{max-width:1640px;margin:0 auto;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}

/* 상단 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;height:62px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo b{font-weight:800;font-size:19px;letter-spacing:-.03em}

.logo .ci{height:40px;width:auto;flex:none;color:var(--ink);display:block}
.logo span{border-left:1px solid var(--line);padding-left:12px;font-size:13.5px;color:var(--sub)}
.nav{display:flex;gap:6px;height:62px;align-items:center}
.nav a{display:flex;align-items:center;font-weight:700;font-size:15px;color:var(--sub);text-decoration:none;padding:7px 16px;border-radius:10px}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--soft)}
.top-r{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.search{position:relative;width:250px}
.search input{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--soft);padding:0 46px 0 36px}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:12px;top:11px;width:16px;height:16px;stroke:var(--faint)}
.search kbd{position:absolute;right:10px;top:9px;font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--card)}
.btn{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.go{background:var(--green);border-color:var(--green);color:var(--go-ink)}
.btn.go:hover{filter:brightness(1.06)}
.pill{border:0;border-radius:10px;background:var(--green);color:var(--go-ink);font-weight:700;padding:9px 16px;cursor:pointer;white-space:nowrap}
.pill.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}

main{padding-block:20px 120px}

/* 대표 글(좌우 스크롤) */
.hero-bar{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.hero-bar h2{margin:0;font-size:14px;font-weight:700}
.toggle{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:3px}
.toggle button{border:0;background:none;border-radius:7px;padding:3px 12px;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hero-bar .ctr{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--faint)}
.hero-bar .ctr button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:92%;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 2px 8px}
.strip::-webkit-scrollbar{display:none}
.hero{all:unset;box-sizing:border-box;cursor:pointer;scroll-snap-align:start;background:var(--soft);border-radius:22px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;padding:26px 30px;min-width:0;max-width:100%}
.hero:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.hero .num{font-family:var(--f);font-size:12px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 11px;display:inline-block;letter-spacing:.04em}
.hero .num::before{content:"No."}
.hero .lbl{margin:14px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}
.hero .lbl b{color:var(--ink)}
.hero h3{margin:0;font-size:31px;font-weight:800;letter-spacing:-.035em;line-height:1.35;text-wrap:balance}
.hl{background:none;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero .sum{margin:10px 0 14px;color:var(--sub);font-size:14.5px;max-width:62ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .metaline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--faint);font-size:12.5px;margin-top:12px}
.hero .art{border-radius:14px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);transform:rotate(1.2deg);min-height:210px;max-height:240px}
.hero .art img{width:100%;height:100%;object-fit:cover;object-position:left top;display:block}
.hero .art .chatshot{height:100%}
.hero .ansbox{padding:20px;display:grid;gap:8px;align-content:start;font-size:13.5px;color:var(--sub)}
.hero .ansbox b{color:var(--ink);font-size:12px}

/* 지금 뜨는 */
.trend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0 26px}
.trend > span{font-weight:700;margin-right:4px}
.trend > span{color:var(--sub);font-weight:500}
.kw{border:0;background:var(--soft);border-radius:8px;padding:5px 11px;font-weight:500;font-size:13px;cursor:pointer;color:var(--ink)}
.kw::before{content:"#";color:var(--faint);margin-right:2px;font-weight:700}
.kw small{color:var(--faint);font-weight:400;margin-left:4px}
.kw[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* 2단 */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.filters{padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px 22px;margin-bottom:20px}
.seg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg > span{font-size:12.5px;font-weight:700;color:var(--ink);margin-right:4px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--go-ink);font-weight:700}

.table{padding:22px 24px 10px}
.table-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.table-h h2{margin:0;font-family:var(--serif);font-size:20px;font-weight:900}
.table-h .r{margin-left:auto;color:var(--faint);font-size:12.5px;display:flex;gap:10px;align-items:center}
.tr{display:grid;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.tr.hd{font-size:12px;color:var(--faint);padding:8px 0;border-top:0;border-bottom:1px solid var(--line)}
.tr.hd + .tr{border-top:0}
button.tr{all:unset;box-sizing:border-box;display:grid;gap:16px;align-items:center;padding:16px 10px;margin:0 -10px;border-radius:12px;border-top:1px solid var(--line);cursor:pointer;width:calc(100% + 20px)}
button.tr:hover{background:var(--soft)}
button.tr:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.tr.cols-case{grid-template-columns:44px 74px minmax(0,1fr) 90px 92px 70px}
.tr.cols-lec{grid-template-columns:44px minmax(0,1fr) 64px 64px 70px}
.tr.cols-qna{grid-template-columns:44px 84px minmax(0,1fr) 110px 56px 56px}
.tr .n{font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--sub);width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.tr h3{margin:0 0 3px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.tr p{margin:0;color:var(--sub);font-size:13px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.tr .mid{min-width:0;display:grid;gap:5px}
.tr .sm{font-size:12.5px;color:var(--faint);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tr .v{font-size:13px}
.lab{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--soft);color:var(--ink);justify-self:start;white-space:nowrap}
.lab.gray{background:var(--soft);color:var(--sub)}
.lab.orange{background:var(--card);color:var(--sub);box-shadow:inset 0 0 0 1px var(--line)}
.tag{font-size:11.5px;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--sub);border:1px solid var(--line)}
.tag.blue{background:var(--soft);color:var(--ink);border-color:transparent}
.tag.green{background:var(--ink);color:var(--bg);border-color:transparent}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.dots{display:flex;gap:3px;margin-top:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.more{display:inline-flex;gap:6px;font-weight:700;padding:14px 0;border-top:1px solid var(--line);width:100%;color:var(--ink);background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
.empty{padding:40px;text-align:center;color:var(--faint)}

/* 오른쪽: AI 질문 칸 */
.side{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));display:grid;gap:16px}
.ask{padding:20px;background:var(--green-soft);border:0;box-shadow:none}
.ask h2{margin:0 0 14px;font-family:var(--serif);font-size:19px;font-weight:900}

.askbox{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.askbox textarea{width:100%;min-height:76px;border:0;background:transparent;resize:none;font-size:14.5px;outline:none}
.askbox button:disabled{opacity:.5;cursor:wait}
.askbox .row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.askbox .cnt{font-family:var(--mono);font-size:12px;color:var(--faint)}
.hint{margin:14px 0 8px;font-size:12.5px;color:var(--sub)}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
.suggest button{border:0;background:var(--card);border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:500;cursor:pointer;text-align:left}
.suggest button:hover{background:var(--soft)}
.log{display:grid;gap:10px;margin-top:16px;max-height:420px;overflow-y:auto}
.log:empty{display:none}
.msg{font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--soft);border-radius:10px;padding:7px 11px;max-width:90%}
.msg.bot{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card)}
.msg.bot.ai::before{content:"AI 답변 · Claude Haiku 5.5";display:block;font-size:11.5px;color:var(--faint);margin-bottom:6px}
.msg.bot.demo::before{content:"예시 답변 · AI 연결 안 됨";display:block;font-size:11.5px;color:var(--faint);margin-bottom:6px;font-family:var(--mono)}
.msg .src{display:block;margin-top:8px;font-size:12px;color:var(--sub)}
.msg .srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);align-items:center}
.msg .srcs button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--green);text-align:left}
.msg .srcs button:hover{border-color:var(--green)}
.watch{padding:18px 20px}
.watch-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.watch-h h2{margin:0;font-family:var(--serif);font-size:17px;font-weight:900}
.watch-h span{font-size:12px;color:var(--faint)}
.wi{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line);width:100%}
.wi:first-of-type{border-top:0}
.wi .k{font-family:var(--mono);color:var(--faint);font-size:13px}
.wi b{font-weight:700;font-size:14px;display:block}
.wi small{color:var(--faint);font-size:12px}
.wi:hover b{text-decoration:underline;text-underline-offset:3px}

/* 공통 조각(상세·모달) */
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none}
.star{font-weight:700;font-variant-numeric:tabular-nums}
.star::before{content:"★ ";color:var(--ink)}
.status{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;display:inline-block;justify-self:start;white-space:nowrap}
.status.done{background:var(--soft);color:var(--ink)}
.status.wait{background:var(--card);color:var(--sub);box-shadow:inset 0 0 0 1px var(--line)}
.chatshot{height:100%;padding:16px;display:flex;flex-direction:column;gap:7px;background:var(--soft)}
.chatshot .b{font-size:12px;line-height:1.5;padding:7px 10px;border-radius:10px;max-width:86%;background:var(--card);border:1px solid var(--line);white-space:pre-wrap}
.chatshot .b.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.back{background:none;border:0;color:var(--sub);cursor:pointer;padding:0;margin-bottom:16px;font-weight:700}
.back:hover{color:var(--ink)}
.lesson{display:grid;grid-template-columns:1fr;gap:16px}
.lesson > .side{position:static}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:16px}
.panel h2{margin:0 0 12px;font-size:16px}
.lesson h1{font-family:var(--serif);font-size:30px;font-weight:900;letter-spacing:-.03em;margin:8px 0 12px}
.goalbox{background:var(--green-soft);border-radius:12px;padding:14px 16px;font-size:15px}
.goalbox b{color:var(--ink);margin-right:8px}
.fig{margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.fig img{display:block;width:100%}
.fig figcaption{font-size:12.5px;color:var(--sub);padding:8px 12px;background:var(--soft)}
table.plan{width:100%;border-collapse:collapse}
.plan td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
.plan td:first-child{width:70px;color:var(--ink);font-weight:700;font-family:var(--mono);font-size:13px;white-space:nowrap}
.prompt{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:13px;white-space:pre-wrap;position:relative;font-family:var(--mono);line-height:1.7}
.prompt button{position:absolute;right:10px;top:10px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:12px;padding:3px 10px;cursor:pointer;font-family:var(--f)}
ul.clean{margin:0;padding-left:18px;display:grid;gap:6px}
.qa{border-left:2px solid var(--green);padding:2px 0 2px 14px}
.qa p{margin:0}.qa p+p{margin-top:6px;color:var(--sub)}
.panel dl{margin:0;display:grid;gap:12px}
.panel dt{font-size:12px;color:var(--faint)}
.panel dd{margin:2px 0 0}
.post h1{font-family:var(--serif);font-size:26px;font-weight:900;letter-spacing:-.02em;margin:10px 0 6px}
.post .meta{color:var(--faint);font-size:13px;margin-bottom:16px}
.post .q{font-size:15px;white-space:pre-wrap}
.ans{border-top:1px solid var(--line);padding:16px 0}
.ans .who{margin-bottom:6px}
.ans p{margin:0;white-space:pre-wrap}
.ans.best{background:var(--soft);border-radius:12px;padding:16px;border-top:0;margin-top:14px}
.ans.best .lbl{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:4px}
.reply{display:flex;gap:10px;margin-top:16px}
.reply textarea{flex:1;min-height:70px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);resize:vertical}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,12,14,.55);display:flex;align-items:center;justify-content:center;padding:24px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;max-width:860px;max-height:calc(100vh - 48px);overflow-y:auto;position:relative}
.sheet.sm{max-width:560px}
.x{position:absolute;right:14px;top:12px;border:1px solid var(--line);background:var(--card);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;color:var(--sub);z-index:2}
.sheet .thumb{height:280px;overflow:hidden}
.sheet .thumb img{width:100%;height:100%;object-fit:cover}
.sheet .chatshot{padding:30px 34px}
.sheet .chatshot .b{font-size:14px;max-width:70%}
.sheet-in{padding:24px 32px 32px}
.sheet-in h2{font-family:var(--serif);font-size:24px;font-weight:900;letter-spacing:-.02em;margin:10px 0 18px}
.detail{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px 20px;margin:0}
.detail dt{color:var(--faint)}
.detail dd{margin:0}
.form{display:grid;gap:14px}
.form h2{margin:0;font-size:20px}
.form label{display:grid;gap:6px;font-weight:500;font-size:13px}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);font-weight:400;font-size:14px}
.form textarea{min-height:90px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .act{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

<script>
const LESSONS=[{"id": "s1", "n": 1, "title": "AI 이해와 도구 고르기", "h": "1.5h", "ph": 1, "goal": "AI가 답을 만드는 방식과 '그럴듯한 오류'를 알고, 채팅형(Claude, ChatGPT)과 에이전트형(Claude Cowork·Claude Code, Codex) 중 내 일을 어디에 맡길지 고른다.", "prep": "Claude 계정과 데스크톱 앱, 사전 설문(AI 활용 설문) 결과, 실습용 폴더 1개(가상 파일 10개 정도)", "plan": [["10분", "설문 결과 공유, 각자 지금 쓰는 방법 한 줄씩"], ["15분", "AI가 답을 만드는 방식(다음 말 이어 붙이기), 그래서 생기는 그럴듯한 오류. 요금제와 회사 자료 입력 원칙"], ["15분", "채팅과 에이전트 비교: 영상은 Gemini, 내 PC 파일 여러 개는 에이전트, 짧은 질문은 채팅"], ["30분", "따라 하기: 같은 질문을 세 번 해서 답 비교 → 같은 폴더 작업을 채팅으로 한 번, 에이전트로 한 번 (아래 그림)"], ["20분", "내 반복 업무 5개를 '채팅 / 에이전트 / 아직 사람'으로 나누기, 공동 과제 소개(예시 페이지 둘러보기)"]], "task": ["내 교과 개념 하나를 \"중학생에게 3문장으로\" 설명하게 하고 틀린 곳 표시하기", "내 반복 업무 5개 분류표. 이 목록이 개인 과제 후보가 됩니다."], "prompt": "이 폴더의 파일 이름을 '단원_번호_제목' 규칙으로 바꾸고, 바꾸기 전·후 이름을 표로 정리해서 같은 폴더에 저장해 줘. 바꾸기 전에 계획을 먼저 보여 줘.", "promptLabel": "에이전트 요청 예", "q": "교정지 PDF 20개를 하나씩 열어 바뀐 목록을 만들고 싶다면 채팅과 에이전트 중 어느 쪽인가요?", "a": "에이전트입니다. 내 컴퓨터의 여러 파일을 직접 열고 결과 파일을 저장해야 하기 때문입니다. 결과는 사람이 원본과 대조합니다.", "img": "img/s02.png", "cap": "채팅으로 할 일, 에이전트에 맡길 일", "links": [["Anthropic Academy AI Fluency (무료 강의)", "https://anthropic.skilljar.com/"], ["Claude 도움말 (Cowork, Claude Code 검색)", "https://support.claude.com/"]]}, {"id": "s2", "n": 2, "title": "업무 실습: 참고서 후속 작업", "h": "2h", "ph": 1, "goal": "엑셀 정리, PDF 요약, PPT·문서 초안, 문제 풀이 중 두 가지를 AI로 끝까지 해 보고, 걸린 시간을 기록한다.", "prep": "문항 목록 메모나 엑셀, 공개 PDF 1개(교육과정 해설 등), 평소에 이 작업에 걸리던 시간", "plan": [["15분", "시연: 흩어진 문항 목록 → 단원·난이도·정답 표 → 엑셀로 내려받기 (아래 그림)"], ["15분", "시연: PDF를 올려 요약하고 PPT 목차 초안 만들기, 한글(HWPX)은 내용을 받아 양식에 붙여 넣는 방법"], ["55분", "각자 실습: 네 가지 중 두 가지를 골라 자기 자료로 진행"], ["20분", "검수: 행 개수, 숫자, 정답을 원본과 대조하고 틀린 곳 기록"], ["15분", "기록 양식 작성: 기존 방법 / AI 방법 / 검토 포함 총시간 / 오류·한계"]], "task": ["두 가지 작업의 결과물과 기록 양식 1장"], "prompt": "위 목록을 [단원, 소단원, 난이도(상/중/하), 정답(①~⑤)] 표로 정리해 줘. 단원 이름은 교과서 목차 표기로 통일하고, 애매한 칸은 '확인 필요'로 써 줘. 엑셀 파일로 줘.", "q": "결과표의 행이 원본보다 하나 적다면 무엇부터 확인하나요?", "a": "원본에서 한 줄에 두 문항이 붙어 있거나 형식이 다른 줄이 있는지 봅니다. 그런 줄을 AI가 합치거나 빠뜨리기 쉽습니다.", "img": "img/s04.png", "cap": "흩어진 문항 목록을 표로 정리하기", "links": [["Claude 도움말 (파일 만들기, 파일 업로드 검색)", "https://support.claude.com/"]]}, {"id": "s3", "n": 3, "title": "교과별 활용", "h": "2h", "ph": 1, "goal": "수식·도형(수학), 그림 설명(과학), 지문·어법 검토(영어·국어), 스캔 글자 읽기를 자기 교과 자료에 써 본다.", "prep": "교과별 자료 한 장씩 (손글씨 수식 사진, 과학 그림, 영어 지문, 국어 예문, 스캔 PDF 1쪽)", "plan": [["20분", "시연 4개: 수식 사진 → LaTeX, 도형 그림 그리기(SVG), 어법 검토표, 스캔 PDF 글자 읽기"], ["15분", "스캔 글자의 한계: 비슷한 숫자·기호(1과 l, 0과 O, −과 –)는 틀릴 수 있어 원본 대조 필수"], ["60분", "교과별 실습 (팀원마다 자기 교과, 팀장이 돌며 도움)"], ["25분", "교과별 결과 5분씩 발표: 잘 된 것 1개, 틀린 것 1개"]], "task": ["수학: 손글씨 풀이 사진을 LaTeX로 옮기고, \"이 삼각형을 SVG로 그려 줘(변의 길이 표시)\"로 도형 만들기", "과학: 실험 장치 그림을 올려 \"중학생용 그림 설명 3줄 + 각 부분 이름\" 받기", "영어: 지문의 어휘 수준 확인, \"중 2 교육과정 기본 어휘 밖 단어\" 목록 뽑기", "국어: 예문의 맞춤법·띄어쓰기를 '원문 / 고친 문장 / 이유' 표로 받기"], "prompt": "다음 예문의 맞춤법과 띄어쓰기를 검토해서 '원문 / 고친 문장 / 이유' 3열 표로 정리해 줘. 확실하지 않으면 '확인 필요'로 표시해 줘.", "q": "AI가 고친 맞춤법이 맞는지 어디서 확인하나요?", "a": "표준국어대사전, 국립국어원 같은 원출처에서 확인합니다.", "img": "img/s05.png", "cap": "교과별 활용: 수식 입력과 어법 검토", "links": []}, {"id": "s4", "n": 4, "title": "프로젝트로 사례 모으기", "h": "1h", "ph": 1, "goal": "Claude '프로젝트'에 지침과 기준 문서를 넣어 두고 반복해서 쓴다. 공동 과제의 사례 카드를 한곳에 모은다.", "prep": "집필 기준·용어 표기 원칙 파일(공개 가능한 범위), 1~3회에 만든 사례 카드", "plan": [["10분", "프로젝트 = 지침 + 파일 + 대화 모음. 대화가 길어져도 기준이 유지되는 이유"], ["15분", "따라 하기: '중등 수학 해설 검수' 프로젝트 만들기, 지침 입력, 파일 올리기, 새 대화에서 검수 요청"], ["25분", "공동 프로젝트 'AI 활용 사례집' 만들기: 카드 양식을 지침에 넣고, 각자 카드를 올려 같은 형식으로 다듬기"], ["10분", "공동 과제 역할 나누기: 내용(카드 정리), 화면(페이지), 챗봇, 검수. 기수 마감일 정하기"]], "task": ["내 교과 프로젝트 1개", "공동 프로젝트에 내 사례 카드 3장 이상"], "prompt": "올린 사례들을 아래 카드 형식으로 정리해 줘.\n[업무] / [도구] / [요청문] / [전후 시간] / [주의점]\n원고나 개인정보로 보이는 내용은 지우고 '삭제함'으로 표시해 줘.", "promptLabel": "사례 정리 요청 예", "q": "프로젝트에 올린 파일은 다른 프로젝트 대화에서도 보일까요?", "a": "아니요. 그 프로젝트 안의 대화에서만 참고합니다.", "img": "img/s06.png", "cap": "프로젝트에 지침과 기준 문서를 저장해 두기", "links": [["Claude 도움말 (Projects 검색)", "https://support.claude.com/"]]}, {"id": "s5", "n": 5, "title": "활용 사례 웹페이지 만들기", "h": "2h", "ph": 2, "goal": "말로 설명해서 'AI 활용 사례' 웹페이지 1차본을 만들고, 고치고, 링크로 공유한다.", "prep": "4회의 사례 카드, 예시 페이지 링크, 페이지에 넣고 싶은 메뉴 목록", "plan": [["15분", "예시 페이지 둘러보기: 시작하기, 업무별 안내, 사례 카드, 의견 남기기, AI 도우미. 우리 페이지 메뉴 정하기"], ["15분", "시연: TF가 만든 'AI 활용 설문' 페이지와 그 요청문 (아래 그림)"], ["50분", "따라 하기: 사례 카드를 붙여 넣고 페이지 만들기 → 말로 고치기 3번 → 휴대폰에서 열어 보기"], ["20분", "내용 담당과 화면 담당이 나눠서 고치기: 카드 문구, 분류(교과·업무), 검색"], ["20분", "서로 써 보고 고칠 점 모으기. 공개 링크에 넣으면 안 되는 것 확인"]], "task": ["사례 페이지 1차본과 공유 링크"], "prompt": "편집자들이 AI 활용 사례를 찾아보는 웹페이지를 만들어 줘. 위에 '시작하기', '업무별 사례', '의견 남기기' 메뉴, 사례는 카드로 보여 주고 교과·업무로 거를 수 있게. 오른쪽 아래에 'AI 도우미' 버튼 자리만 만들어 둬. 휴대폰에서도 보기 좋게. 사례 카드는 아래에 붙여 넣을게.", "q": "공개 링크로 만든 페이지에 미공개 원고를 사례로 넣어도 될까요?", "a": "안 됩니다. 링크를 아는 누구나 볼 수 있습니다. 사례는 가상 자료나 공개 단원으로 바꿔 씁니다.", "img": "img/s07.png", "cap": "말로 설명해서 웹페이지 받기. 오른쪽 미리보기는 실제 페이지입니다.", "links": [["공동 과제 예시 페이지", "https://donga-ai-feedback-hub.baboo84.chatgpt.site/"], ["AI 활용 설문 (실제 페이지)", "https://claude.ai/artifact/G5MMDADv4ixZfANRg3r1Y9"]]}, {"id": "s6", "n": 6, "title": "GitHub로 함께 고치기", "h": "1.5h", "ph": 2, "goal": "공동 페이지를 저장소에 올리고, 각자 맡은 부분을 따로 고친 뒤 합친다. 고친 이력을 보고 되돌릴 수 있다.", "prep": "GitHub 계정, 5회 페이지 파일, 사례 카드를 담은 파일(cases.json 등)", "plan": [["15분", "저장소, 커밋, 브랜치, 합치기(PR)를 편집 업무에 빗대기 (커밋 = 교정 이력 한 줄, 브랜치 = 각자의 교정지)"], ["20분", "따라 하기: 비공개 공동 저장소 만들기 → 페이지와 사례 파일 올리기 → 한 줄 고치고 커밋 → 이력 비교"], ["30분", "역할별 브랜치에서 각자 작업: 내용 담당은 사례 파일, 화면 담당은 페이지. Claude Code에 시키고 바뀐 곳(diff)만 확인"], ["25분", "합치기: PR 열기 → 팀장이 확인 → 합치기. 같은 줄을 둘이 고쳤을 때 해결하는 법"]], "task": ["공동 저장소에 내 커밋 2개, 합쳐진 PR 1개"], "prompt": "이 저장소의 cases.json에 아래 사례 카드 2개를 같은 형식으로 추가하고, 페이지에서 잘 보이는지 확인한 뒤 '사례 2건 추가' 메시지로 커밋해 줘. 바뀐 곳을 먼저 보여 줘.", "promptLabel": "Claude Code 요청 예", "q": "두 사람이 같은 파일을 동시에 고칠 때 브랜치가 왜 필요한가요?", "a": "각자 갈래에서 고친 뒤 확인하고 합치므로 서로의 수정을 덮어쓰지 않습니다.", "img": "img/s08.png", "cap": "GitHub: 고친 이력을 남기고 함께 쓰기", "links": [["GitHub Docs 시작하기", "https://docs.github.com/ko/get-started"]]}, {"id": "s7", "n": 7, "title": "커넥터와 스킬", "h": "1h", "ph": 2, "goal": "커넥터(구글 드라이브 등)를 권한을 확인하며 연결하고, 사례 카드 쓰는 방법을 스킬로 묶어 팀이 같이 쓴다.", "prep": "실습용 구글 드라이브 폴더, 4회의 카드 양식과 지침", "plan": [["10분", "커넥터 = 다른 서비스와의 연결, 스킬 = 일하는 방법 묶음. 읽기 권한과 쓰기 권한의 차이"], ["20분", "따라 하기: 구글 드라이브 연결 → \"사례 폴더의 문서를 카드 형식으로 정리\" 요청 → 연결 끊는 법까지"], ["20분", "스킬 만들기: '사례 카드 쓰기' 스킬로 저장하고, 다른 팀원이 불러 써서 같은 형식이 나오는지 확인"], ["10분", "주의점: 회사/개인 계정 구분, 남이 만든 스킬은 내용을 읽고 설치, 쓰기 권한은 필요할 때만"]], "task": ["드라이브 연결 실습 1회, '사례 카드 쓰기' 스킬 1개"], "prompt": "드라이브의 'AI 사례' 폴더에 있는 문서를 읽고, 각 문서를 사례 카드 형식으로 정리해 표로 보여 줘. 파일은 고치지 말고 읽기만 해.", "q": "드라이브에 '쓰기' 권한을 주면 AI가 무엇을 할 수 있게 되나요?", "a": "파일을 만들고, 고치고, 지울 수 있게 됩니다. 처음에는 읽기만 허용합니다.", "img": "img/s09.png", "cap": "커넥터와 스킬: 연결할 때 권한부터 본다", "links": [["Claude 도움말 (connectors, skills 검색)", "https://support.claude.com/"]]}, {"id": "s8", "n": 8, "title": "API 배우기", "h": "2h", "ph": 3, "goal": "API가 무엇인지, 구독과 요금이 어떻게 다른지 알고, 키를 안전하게 두고 첫 호출을 해 본다. 챗봇의 '엔진'을 미리 시험한다.", "prep": "노트북, TF 공용 API 키(팀장이 한도 설정 후 배포), 사례 파일, 계산기", "plan": [["15분", "API = 프로그램이 AI에게 일을 시키는 창구. 웹페이지 챗봇도 뒤에서는 API를 부른다"], ["15분", "요금: 토큰(주고받은 글의 양) × 모델 단가. 구독료에 API 요금은 포함되지 않음. 챗봇 하루 50회 기준 한 달 비용 어림하기"], ["15분", "콘솔(관리 화면): 키 만들기, 사용량·한도 보기. 키는 환경 변수에 넣고 코드·메신저에 쓰지 않기"], ["45분", "따라 하기: 사례 파일 + 질문을 보내 답 받기 (아래 그림 방식). 코드는 Claude에게 부탁해서 받는다"], ["30분", "답 검토: 사례에 있는 질문, 없는 질문을 3개씩 보내 보고 지어낸 답이 있는지 기록. 작은 모델과 큰 모델 비교"]], "task": ["첫 호출 성공 화면, 질문 6개의 답 검토표, 한 달 비용 어림"], "prompt": "cases.json의 사례 목록과 내 질문을 Claude API에 보내서, 사례 목록 안의 내용으로만 답하게 하는 파이썬 코드를 만들어 줘. 목록에 없으면 '아직 사례가 없어요'라고 답하게 해 줘. API 키는 ANTHROPIC_API_KEY 환경 변수에서 읽어. 작은 모델부터 써 줘.", "q": "API 키가 들어 있는 코드를 메신저로 보냈다면 가장 먼저 할 일은?", "a": "콘솔에서 그 키를 즉시 삭제하고 새로 발급합니다.", "img": "img/s11.png", "cap": "API 첫 호출 예", "links": [["Claude API 시작하기", "https://docs.claude.com/en/docs/get-started"], ["Claude API 요금표", "https://docs.claude.com/en/docs/about-claude/pricing"]]}, {"id": "s9", "n": 9, "title": "웹페이지에 챗봇 넣기", "h": "2h", "ph": 3, "goal": "사례 페이지에 'AI 도우미' 챗봇을 넣어, 사례 목록을 근거로 답하게 하고 키가 드러나지 않게 공개한다.", "prep": "6회 공동 저장소, 8회 코드와 API 키, 배포할 곳(회사 승인 범위 안에서 정함)", "plan": [["15분", "구조: 웹페이지 → 중간 서버 함수(키 보관, 횟수 제한) → A const nm=k=>(PEOPLE[k]||[k])[0];
const tm=k=>(PEOPLE[k]||[,""])[1];
const F={case:{kind:new Set(),subj:new Set(),tool:new Set()},qna:"all",lec:0,sort:"new"};

function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2400)}

function counts(){ $("#n-lec").textContent=LESSONS.length;$("#n-case").textContent=CASES.length;$("#n-qna").textContent=QNA.length }

/* 왼쪽 필터 */
function cb(group,val,n){const on=F.case[group].has(val);return `<label><input type="checkbox" data-g="${group}" value="${esc(val)}" ${on?"checked":""}>${esc(val)}<span>${n}</span></label>`}
function filters(){
  let h="";
  if(view==="cases"){
    const cnt=(f,v)=>CASES.filter(c=>f(c).includes?f(c).includes(v):f(c)===v).length;
    h+=`<div class="fgroup"><h4>구분</h4>${["개인","팀 교육"].map(v=>cb("kind",v,CASES.filter(c=>c.kind===v).length)).join("")}</div>`;
    h+=`<div class="fgroup"><h4>교과</h4>${["국어","수학","영어","과학"].map(v=>cb("subj",v,CASES.filter(c=>c.subj===v).length)).join("")}</div>`;
    const tools=[...new Set(CASES.flatMap(c=>c.tools))];
    h+=`<div class="fgroup"><h4>사용 프로그램</h4>${tools.map(v=>cb("tool",v,CASES.filter(c=>c.tools.includes(v)).length)).join("")}</div>`;
    h+=`<button class="reset" id="reset">필터 초기화</button>`;
  } else if(view==="lectures"){
    h+=`<div class="fgroup"><h4>기간</h4>${[[0,"전체"],[1,"1개월"],[2,"2개월"],[3,"3개월"]].map(([v,l])=>`<label><input type="radio" name="ph" value="${v}" ${F.lec==v?"checked":""}>${l}<span>${v?LESSONS.filter(x=>x.ph==v).length:LESSONS.length}</span></label>`).join("")}</div>`;
  } else {
    h+=`<div class="fgroup"><h4>상태</h4>${[["all","전체"],["wait","답변 대기"],["done","답변 완료"]].map(([v,l])=>`<label><input type="radio" name="qs" value="${v}" ${F.qna===v?"checked":""}>${l}<span>${v==="all"?QNA.length:QNA.filter(x=>(x.ans.length?"done":"wait")===v).length}</span></label>`).join("")}</div>`;
  }
  $("#filters").innerHTML=h;
}
$("#filters").addEventListener("change",e=>{const t=e.target;
  if(t.dataset.g){t.checked?F.case[t.dataset.g].add(t.value):F.case[t.dataset.g].delete(t.value)}
  if(t.name==="ph")F.lec=+t.value; if(t.name==="qs")F.qna=t.value; draw()});
$("#filters").addEventListener("click",e=>{if(e.target.id==="reset"){Object.values(F.case).forEach(s=>s.clear());filters();draw()}});

/* 강의 */
function lecCard(x){return `<button type="button" class="card" data-lec="${x.id}">
  <div class="thumb">${x.img?`<img src="${x.img}" alt="">`:""}<span class="no">${x.n}회</span></div>
  <div class="cbody"><div class="tags"><span class="tag blue">${PH[x.ph][0]}</span><span class="tag">${esc(x.h)}</span></div>
  <h3>${esc(x.title)}</h3><p>${esc(x.goal)}</p>
  <div class="cfoot"><span>강의</span><span>자세히 →</span></div></div></button>`}
function lectures(){
  if(detail)return lessonView(LESSONS.find(x=>x.id===detail));
  const s=q();let L=LESSONS.filter(x=>(!F.lec||x.ph==F.lec)&&(!s||JSON.stringify(x).includes(s)));
  let h=`<div class="head"><h1>강의</h1><span class="count">${L.length}개</span><div class="right"><button class="pill ghost" id="add-lec">강의 올리기</button></div></div>`;
  if(!L.length)return h+`<div class="board" style="padding:40px;text-align:center;color:var(--faint)">찾는 강의가 없습니다.</div>`;
  [1,2,3].forEach(p=>{const g=L.filter(x=>x.ph==p);if(g.length)h+=`<div class="phase">${PH[p][0]} <span>${PH[p][1]}</span></div><div class="grid">${g.map(lecCard).join("")}</div>`});
  return h;
}
function lessonView(x){
  const i=LESSONS.indexOf(x),prev=LESSONS[i-1],next=LESSONS[i+1];
  return `<button class="back" data-back>← 강의 목록</button>
  <div class="lesson"><div>
    <div class="panel"><div class="tags"><span class="tag blue">${x.n}회</span><span class="tag">${esc(x.h)}</span></div>
      <h1>${esc(x.title)}</h1><div class="goalbox"><b>목표</b>${esc(x.goal)}</div></div>
    ${x.img?`<div class="panel"><figure class="fig"><img src="${x.img}" alt="${esc(x.cap)}"><figcaption>${esc(x.cap)}</figcaption></figure></div>`:""}
    <div class="panel"><h2>진행 순서</h2><table class="plan">${x.plan.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}</table></div>
    ${x.prompt?`<div class="panel"><h2>${esc(x.promptLabel||"요청 예")}</h2><div class="prompt"><button data-copy>복사</button><span>${esc(x.prompt)}</span></div></div>`:""}
    <div class="panel"><h2>실습 과제</h2><ul class="clean">${x.task.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
    ${x.q?`<div class="panel"><h2>확인 질문</h2><div class="qa"><p><b>Q.</b> ${esc(x.q)}</p><p><b>A.</b> ${esc(x.a)}</p></div></div>`:""}
  </div>
  <div class="side"><div class="panel"><dl><dt>강사</dt><dd>관리자</dd><dt>시간</dt><dd>${esc(x.h)}</dd><dt>준비물</dt><dd>${esc(x.prep)}</dd>
    ${x.links&&x.links.length?`<dt>참고 링크</dt><dd>${x.links.map(([t,u])=>`<div><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a></div>`).join("")}</dd>`:""}</dl></div>
    <div class="panel" style="display:flex;gap:8px;justify-content:space-between">
      ${prev?`<button class="pill ghost" data-lec="${prev.id}">← ${prev.n}회</button>`:"<span></span>"}
      ${next?`<button class="pill" data-lec="${next.id}">${next.n}회 →</button>`:""}</div></div></div>`;
}

/* 활용사례 */
const shot=c=>`<div class="chatshot">${c.shot.map(([w,s])=>`<div class="b ${w==="me"?"me":""}">${esc(s)}</div>`).join("")}</div>`;
function caseCard(c){const i=CASES.indexOf(c);return `<button type="button" class="card" data-case="${i}">
  <div class="thumb">${c.img?`<img src="${c.img}" alt="">`:shot(c)}</div>
  <div class="cbody"><div class="who">${av(c.by)}<span>${esc(nm(c.by))} · ${esc(c.team)}</span></div>
  <h3>${esc(c.t)}</h3>
  <div class="tags"><span class="tag ${c.kind==="개인"?"blue":"green"}">${esc(c.kind)}</span>${c.tools.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
  <div class="cfoot"><span>적용 ${esc(c.team)} · ${esc(c.date)}</span><span class="star">${c.score.toFixed(1)}</span></div></div></button>`}
function cases(){
  const s=q(),f=F.case;
  let C=CASES.filter(c=>(!f.kind.size||f.kind.has(c.kind))&&(!f.subj.size||f.subj.has(c.subj))&&(!f.tool.size||c.tools.some(t=>f.tool.has(t)))&&(!s||JSON.stringify(c).includes(s)));
  if(F.sort==="score")C=[...C].sort((a,b)=>b.score-a.score);
  return `<div class="head"><h1>활용사례</h1><span class="count">${C.length}건</span><div class="right">
    <select class="sort" id="sort" aria-label="정렬"><option value="new" ${F.sort==="new"?"selected":""}>최신순</option><option value="score" ${F.sort==="score"?"selected":""}>만족도순</option></select>
    <button class="pill" data-write="case">사례 올리기</button></div></div>
    ${C.length?`<div class="grid">${C.map(caseCard).join("")}</div>`:`<div class="board" style="padding:40px;text-align:center;color:var(--faint)">조건에 맞는 사례가 없습니다.</div>`}`;
}
function openCase(i){const c=CASES[i];
  $("#sheet").className="sheet";
  $("#sheet").innerHTML=`<button class="x" data-close aria-label="닫기">×</button><div class="thumb">${c.img?`<img src="${c.img}" alt="">`:shot(c)}</div>
  <div class="sheet-in"><div class="who">${av(c.by)}<span>${[nm(c.by),tm(c.by),c.date].filter(Boolean).map(esc).join(" · ")}</span></div>
  <h2>${esc(c.t)}</h2>
  <dl class="detail"><dt>구분</dt><dd>${esc(c.kind)}</dd><dt>사용 프로그램</dt><dd>${c.tools.map(esc).join(", ")}</dd><dt>${c.src?"회사":"적용한 팀"}</dt><dd>${esc(c.team)}</dd>
  ${c.score?`<dt>팀내 만족도</dt><dd class="star">${c.score.toFixed(1)} / 10</dd>`:""}${c.src?`<dt>출처</dt><dd><a href="${c.src[1]}" target="_blank" rel="noopener">${esc(c.src[0])}</a></dd>`:""}<dt>기존 방법</dt><dd>${esc(c.before)}</dd><dt>AI 활용 방법</dt><dd>${esc(c.sum)}</dd><dt>오류·한계</dt><dd>${esc(c.limit)}</dd></dl>
  ${c.img?"":`<p style="color:var(--faint);font-size:12.5px;margin:20px 0 0">${c.src?"위 화면은 이해를 돕기 위한 예시입니다. 자세한 내용은 출처를 보세요.":"위 화면은 캡처 예시입니다. 실제로는 올린 캡처가 보입니다."}</p>`}</div>`;
  $("#modal").hidden=false}

/* Q&A */
function qna(){
  if(detail!==null)return postView(QNA[detail]);
  const s=q();const L=QNA.filter(x=>(F.qna==="all"||(x.ans.length?"done":"wait")===F.qna)&&(!s||JSON.stringify(x).includes(s)));
  return `<div class="head"><h1>Q&amp;A</h1><span class="count">${L.length}개</span><div class="right"><button class="pill" data-write="qna">질문하기</button></div></div>
  <div class="board"><div class="brow hd"><span>상태</span><span>제목</span><span class="c3">작성자</span><span>답변</span><span class="c5">날짜</span></div>
  ${L.map(x=>{const i=QNA.indexOf(x),d=x.ans.length;return `<button type="button" class="brow" data-post="${i}"><span class="status ${d?"done":"wait"}">${d?"답변 완료":"답변 대기"}</span>
    <span class="t">${esc(x.t)}</span><span class="c3 n">${esc(nm(x.by))} · ${esc(tm(x.by))}</span><span class="n">${d}</span><span class="c5 n">${esc(x.date)}</span></button>`}).join("")||`<div style="padding:40px;text-align:center;color:var(--faint)">질문이 없습니다.</div>`}</div>`;
}
function postView(x){const i=QNA.indexOf(x);
  const best=x.ans.filter(a=>a.best),rest=x.ans.filter(a=>!a.best);
  return `<button class="back" data-back>← Q&amp;A 목록</button><div class="panel post" style="max-width:860px">
  <span class="status ${x.ans.length?"done":"wait"}">${x.ans.length?"답변 완료":"답변 대기"}</span>
  <h1>${esc(x.t)}</h1><div class="meta">${esc(nm(x.by))} · ${esc(tm(x.by))} · ${esc(x.date)} · 조회 ${x.views}</div>
  ${x.q?`<div class="q">${esc(x.q)}</div>`:""}
  ${best.map(a=>`<div class="ans best"><div class="lbl">채택된 답변</div><div class="who">${av(a.by)}<span>${esc(nm(a.by))} · ${esc(tm(a.by))}</span></div><p>${esc(a.a)}</p></div>`).join("")}
  <div style="margin-top:20px;font-weight:700">답변 ${x.ans.length}</div>
  ${rest.map(a=>`<div class="ans"><div class="who">${av(a.by)}<span>${esc(nm(a.by))} · ${esc(tm(a.by))}</span></div><p>${esc(a.a)}</p></div>`).join("")}
  <form class="reply" data-reply="${i}"><textarea id="reply-in" placeholder="답변을 남겨 주세요" aria-label="답변"></textarea><button class="pill" type="submit">등록</button></form></div>`;
}

  $("#sheet").innerHTML=`<button class="x" data-close aria-label="닫기">×</button><form class="sheet-in form" id="wform" data-kind="${kind}">${body}

    <div class="act"><button type="button" class="pill ghost" data-close>취소</button><button class="pill" type="submit">올리기</button></div></form>`;

document.addEventListener("submit",e=>{
  if(e.target.id==="wform"){e.preventDefault();const k=e.target.dataset.kind;
    if(k==="case"){const file=$("#w-img").files[0];
      const add=img=>{CASES.unshift({by:"kim",kind:$("#w-kind").value,subj:$("#w-subj").value,tools:($("#w-tools").value||"Claude").split(",").map(s=>s.trim()).filter(Boolean),
        t:$("#w-t").value,team:$("#w-team").value||"수학팀",score:+$("#w-score").value||0,date:"11.02",sum:$("#w-sum").value,before:"-",limit:"-",img,likes:0,shot:[["me","(캡처 없음)"]]});

document.addEventListener("click",e=>{const t=e.target.closest("[data-sc],[data-htab],[data-ltab],#ai-go");if(!t)return;
  if(t.id==="ai-go"){const v=q();if(v){ask(v.slice(0,500))}else $("#chat-in").focus();$("#side").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(t.dataset.htab){G.htab=t.dataset.htab;draw();return}

function homeNews(){

  <div class="pnews">${feat}<ul class="plist">${list}</ul></div><div class="pfoot">${more}</div></section>`;

function homeSearch(s){
  const L=LESSONS.filter(x=>JSON.stringify(x).includes(s)),C=CASES.filter(x=>JSON.stringify(x).includes(s)),Q=QNA.filter(x=>JSON.stringify(x).includes(s));
  const sec=(t,items,href)=>`<section class="pbox"><div class="ptabs"><button type="button" class="on" aria-pressed="true">${t} ${items.length}</button><a class="more" href="${href}">목록에서 보기 ›</a></div><ul class="plist" style="padding:4px 20px 20px">${items.join("")||`<li><em>찾는 내용이 없습니다.</em></li>`}</ul></section>`;
  return `<div class="pstrip" style="margin:0 0 14px">‘${esc(s)}’ 검색 결과 · AI에게 물어보려면 검색창의 <b>AI</b> 버튼을 누르세요</div>`
   +sec("강의",L.map(x=>`<li><button type="button" data-lec="${x.id}">${x.n}회 · ${esc(x.title)}</button><em>${esc(x.h)}</em></li>`),"#lectures")
   +sec("활용사례",C.map(c=>`<li><button type="button" data-case="${CASES.indexOf(c)}">${esc(c.t)}</button><em>${esc(c.subj)}</em></li>`),"#cases")
   +sec("Q&A",Q.map(x=>`<li><button type="button" data-post="${QNA.indexOf(x)}">${esc(x.t)}</button><em>답변 ${x.ans.length}</em></li>`),"#qna");
}
function home(){const s=q();return s?homeSearch(s):homeNews()+homeTiles()}
function statsBox(){const w=QNA.filter(x=>!x.ans.length).length;
  return `<h2>한눈에 보기</h2><div class="stats"><button type="button" onclick="location.hash='lectures'"><b>${LESSONS.length}</b><span>강의</span></button><button type="button" onclick="location.hash='cases'"><b>${CASES.length}</b><span>활용사례</span></button><button type="button" onclick="location.hash='qna'"><b>${QNA.length}</b><span>질문</span></button><button type="button" class="wait" onclick="G.qs='wait';location.hash='qna'"><b>${w}</b><span>답변 대기</span></button></div>`}

route=function(){if(skipRoute){skipRoute=false;return}G.kw="";G.all=false;const h=location.hash.slice(1);view=["lectures","cases","qna","news","ai"].includes(h)?h:"home";detail=null;draw();window.scrollTo(0,0)};

/* 챗봇 답의 "출처:" 줄을 눌러서 이동하는 버튼으로 */
function srcLinks(d,text){
  const lines=text.trimEnd().split("\n");const k=lines.findLastIndex(l=>/^\s*출처\s*:/.test(l));if(k<0)return;
  const line=lines[k];const re=/강의\s*(\d+)\s*회(?:\s*「[^」]*」)?|사례\s*「([^」]+)」|질문\s*「([^」]+)」|소식\s*「([^」]+)」/g;
  const find=(arr,key,t)=>arr.find(x=>x[key]===t)||arr.find(x=>x[key]&&(x[key].includes(t)||t.includes(x[key])));
  const btns=[];let m;
  while((m=re.exec(line))){
    if(m[1]){const L=LESSONS.find(x=>x.n==+m[1]);if(L)btns.push(`<button type="button" data-lec="${L.id}">강의 ${L.n}회 · ${esc(L.title)}</button>`)}
    else if(m[2]){const c=find(CASES,"t",m[2]);if(c)btns.push(`<button type="button" data-case="${CASES.indexOf(c)}">사례 · ${esc(c.t)}</button>`)}
    else if(m[3]){const x=find(QNA,"t",m[3]);if(x)btns.push(`<button type="button" data-post="${QNA.indexOf(x)}">질문 · ${esc(x.t)}</button>`)}
    else if(m[4]){const n=find(NEWS,"t",m[4]);if(n)btns.push(`<button type="button" data-news="${n.id}">소식 · ${esc(n.t)}</button>`)}
  }
  if(!btns.length)return;
  d.textContent=lines.filter((_,i)=>i!==k).join("\n").trimEnd();
  d.insertAdjacentHTML("beforeend",`<div class="srcs"><span>출처</span>${[...new Set(btns)].join("")}</div>`);
}

/* ===== AX 뉴스: /api/news (매일 아침 7시 자동으로 모음) ===== */
let NEWSFEED=[],UPDATES=[],OFFICIAL=[],NEWS_LOADED=false;G.ncat="";G.uco="";G.usrc="official";
const mainFeed=()=>NEWSFEED;
fetch("/api/news").then(r=>r.ok?r.json():{news:[]}).then(d=>{NEWSFEED=d.news||[];UPDATES=d.updates||[];OFFICIAL=d.official||[]}).catch(()=>{}).finally(()=>{NEWS_LOADED=true;if(view==="news"||view==="ai"||view==="home")draw()});
const kday=iso=>{const d=new Date(new Date(iso).getTime()+9*3600e3);return `${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 (${"일월화수목금토"[d.getUTCDay()]})`};
const ktime=iso=>{const d=new Date(new Date(iso).getTime()+9*3600e3);return String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0")};
document.addEventListener("click",e=>{const t=e.target.closest("[data-ncat]");if(t){G.ncat=t.dataset.ncat;draw()}});
function axNews(){
  const s=srch();const cats=["기업 AX","교육·출판","정책·제도","기술·도구"];
  const F=NEWSFEED;
  const L=F.filter(n=>(!G.ncat||n.cat===G.ncat)&&(!s||(n.title+n.source+(n.summary||"")).includes(s)));
  let rows="",day="";
  for(const n of L){const k=n.published_at?kday(n.published_at):"날짜 없음";if(k!==day){day=k;rows+=`<div class="nday">${k}</div>`}
    rows+=`<div class="nrow"><span class="c">${esc(n.cat)}</span><div class="t"><a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>${n.summary?`<small>${esc(n.summary)}</small>`:""}</div><em>${esc(n.source)}${n.published_at?" · "+ktime(n.published_at):""}</em></div>`}
  return `<section class="pbox"><div class="nhead"><h1>AX 뉴스</h1><p>기업·교육·출판의 AI 전환 소식을 매일 아침 7시에 자동으로 모아요. 제목을 누르면 기사가 새 창으로 열려요. (모음: 네이버 뉴스 · 분류: Claude)</p></div>
  <div class="nchips"><button type="button" data-ncat="" aria-pressed="${!G.ncat}">전체 ${F.length}</button>${cats.map(c=>`<button type="button" data-ncat="${c}" aria-pressed="${G.ncat===c}">${c} ${F.filter(n=>n.cat===c).length}</button>`).join("")}</div>
  ${rows||`<div class="empty" style="padding:30px 22px;color:var(--faint)">${NEWS_LOADED?"아직 모은 뉴스가 없어요. 매일 아침 7시에 새 뉴스가 들어와요.":"불러오는 중…"}</div>`}<div style="height:10px"></div></section>`;
}

/* ===== AI 소식: 새 AI 모델·기능 출시 소식이 매일 쌓임 (cat = "AI 업데이트") ===== */

document.addEventListener("click",e=>{const t=e.target.closest("[data-usrc]");if(t){G.usrc=t.dataset.usrc;G.uco="";draw()}});
function aiNews(){
  const s=srch(),off=G.usrc==="official",F=off?OFFICIAL:UPDATES;
  const cnt={};F.forEach(n=>cnt[n.co]=(cnt[n.co]||0)+1);
  const cos=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  const L=F.filter(n=>(!G.uco||n.co===G.uco)&&(!s||(n.co+n.product+n.summary+n.title+n.source).includes(s)));
  let rows="",day="";
  for(const n of L){const k=n.published_at?kday(n.published_at):"날짜 없음";if(k!==day){day=k;rows+=`<div class="nday">${k}</div>`}
    rows+=off?`<div class="nrow"><span class="c">${esc(n.co)}</span><div class="t"><a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>${n.summary?`<small>${esc(n.summary)}</small>`:""}</div><em>${esc(n.source)}</em></div>`
      :`<div class="nrow"><span class="c">${esc(n.co)}</span><div class="t"><a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer"><b>${esc(n.product)}</b> · ${esc(n.summary)}</a><small>${esc(n.title)}</small></div><em>${esc(n.source)}</em></div>`}
  const picks=NEWS.map(n=>`<button type="button" data-news="${n.id}"><small>${esc(n.co)} · ${esc(n.state)}</small><b>${esc(n.model)}</b><span>${esc(n.sum)}</span></button>`).join("");
  return `<section class="pbox"><div class="nhead"><h1>AI 소식</h1><p>AI 회사가 직접 올린 공식 발표와, 새 AI 모델·기능을 다룬 뉴스를 매일 아침 7시에 자동으로 모아 쌓아요. 누르면 원문이 새 창으로 열려요.</p></div>
  <div class="upicks">${picks}</div>
  <div class="usrc" role="tablist"><button type="button" data-usrc="official" aria-pressed="${off}">회사 공식 발표 <span>${OFFICIAL.length}</span></button><button type="button" data-usrc="news" aria-pressed="${!off}">뉴스 기사 <span>${UPDATES.length}</span></button></div>
  <p class="usrc-note">${off?"OpenAI · Anthropic · Google이 자기 사이트에 올린 발표를 한국어로 정리했어요. (번역: Claude)":"네이버 뉴스에서 ChatGPT · Claude · Gemini 같은 AI 도구의 새 기능 기사를 골랐어요. (정리: Claude)"}</p>
  <div class="nchips"><button type="button" data-uco="" aria-pressed="${!G.uco}">전체 ${F.length}</button>${cos.map(c=>`<button type="button" data-uco="${esc(c)}" aria-pressed="${G.uco===c}">${esc(c)} ${cnt[c]}</button>`).join("")}</div>
  ${rows||`<div class="empty" style="padding:30px 22px;color:var(--faint)">${NEWS_LOADED?"아직 모은 소식이 없어요. 매일 아침 7시에 새 소식이 들어와요.":"불러오는 중…"}</div>`}<div style="height:10px"></div></section>`;
}
