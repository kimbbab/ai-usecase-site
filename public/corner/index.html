<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>코너명 회의</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url("/fonts/PretendardVariable.woff2") format("woff2-variations"),url("/fonts/PretendardVariable.woff2") format("woff2")}
:root{
  --bg:#ffffff; --soft:#f6f7f8; --ink:#111316; --sub:#5e646e; --faint:#9298a2; --line:#e8eaed;
  --blue:#2f6bff; --blue-ink:#ffffff; --me:#eef3ff; --ok:#1f9d55; --warn:#d97706;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1113; --soft:#16191c; --ink:#eef0f2; --sub:#a4aab3; --faint:#6f7680; --line:#262a2f; --me:#1b2440;
}}
:root[data-theme="dark"]{--bg:#0f1113; --soft:#16191c; --ink:#eef0f2; --sub:#a4aab3; --faint:#6f7680; --line:#262a2f; --me:#1b2440}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:700}
header .sp{flex:1}
header label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
input,textarea,button{font:inherit;color:inherit}
input.name{width:110px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);min-height:0}
section{display:flex;flex-direction:column;min-height:0}
section+section{border-left:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
.bar h2{font-size:14px;margin:0;font-weight:700}
.bar .hint{font-size:12px;color:var(--faint)}
.bar .sp{flex:1}
.status{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--warn)} .dot.err{background:#dc2626}
#minutes{flex:1;width:100%;border:0;resize:none;padding:18px 20px;background:var(--bg);outline:none;line-height:1.75;font-size:15px}
.foot{font-size:12px;color:var(--faint);padding:6px 16px;border-top:1px solid var(--line)}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:10px 14px;border-radius:12px;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--me);white-space:pre-wrap}
.msg.bot{align-self:flex-start;background:var(--soft)}
.msg.bot p{margin:.4em 0} .msg.bot ul,.msg.bot ol{margin:.4em 0;padding-left:1.4em}
.msg.bot table{border-collapse:collapse;margin:.5em 0;font-size:14px} .msg.bot th,.msg.bot td{border:1px solid var(--line);padding:4px 8px}
.msg.bot pre{background:var(--bg);border:1px solid var(--line);padding:8px;border-radius:8px;overflow:auto}
.msg.bot code{font-size:13px}
.msg .tools{margin-top:6px;display:flex;gap:6px}
.msg .tools button{font-size:12px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 8px;cursor:pointer;color:var(--sub)}
.wait{color:var(--faint)}
.empty{color:var(--sub);font-size:14px;margin:auto 0;text-align:center}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
form{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
#att{display:flex;flex-wrap:wrap;gap:6px;width:100%}
#att:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:3px 8px;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.chip button{border:0;background:none;cursor:pointer;color:var(--faint);padding:0 2px;font-size:14px;line-height:1}
.chip.busy{opacity:.6}
.msg.user .chips2{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.clip{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:44px;cursor:pointer;font-size:18px;color:var(--sub)}
.panel{flex:1;display:flex;flex-direction:column;min-height:0}
.panel[hidden]{display:none}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--sub)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#rlog{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.rm{display:flex;flex-direction:column;max-width:88%;align-self:flex-start}
.rm.mine{align-self:flex-end;align-items:flex-end}
.rm .who{font-size:12px;color:var(--sub);margin:0 4px 2px}
.rm .who b{color:var(--ink);font-weight:600}
.rm .bub{padding:8px 12px;border-radius:12px;background:var(--soft);word-break:break-word;white-space:pre-wrap}
.rm.mine .bub{background:var(--me)}
.rm.bot .bub{white-space:normal;border:1px solid var(--line);background:var(--bg)}
.rm.bot .bub p{margin:.3em 0} .rm.bot .bub ul,.rm.bot .bub ol{margin:.3em 0;padding-left:1.3em}
.rm.bot .bub table{border-collapse:collapse;font-size:14px} .rm.bot .bub th,.rm.bot .bub td{border:1px solid var(--line);padding:3px 6px}
.badge{font-size:11px;padding:1px 6px;border-radius:6px;margin-left:4px;color:#fff}
.badge.claude{background:#c26a43} .badge.exaone{background:#a50034}
.typing{font-size:13px;color:var(--faint);padding:0 4px}
.callers{display:flex;align-items:center;gap:6px;width:100%;font-size:12px;color:var(--faint)}
.callers button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}
#rq{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);max-height:180px;min-height:44px}
section.drop{outline:2px dashed var(--blue);outline-offset:-6px}
#q{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);max-height:180px;min-height:44px}
.btn{border:0;background:var(--blue);color:var(--blue-ink);border-radius:10px;padding:0 16px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.ghost{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 10px;font-size:13px;cursor:pointer}
@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:55vh auto}
  section+section{border-left:0;border-top:1px solid var(--line)}
  #log{min-height:45vh}
  header label span{display:none}
}
</style>
</head>
<body>
<header>
  <h1>신간 교재 코너명 회의</h1>
  <div class="sp"></div>
  <label><span>내 이름</span><input class="name" id="name" maxlength="20" placeholder="이름"></label>
</header>
<main>
  <section>
    <div class="bar">
      <h2>회의록</h2><span class="hint">모두 함께 고치기</span>
      <div class="sp"></div>
      <div class="status"><i class="dot" id="dot"></i><span id="st">불러오는 중…</span></div>
    </div>
    <textarea id="minutes" spellcheck="false" disabled></textarea>
    <div class="foot" id="foot">고친 내용은 자동 저장되고, 다른 사람 화면에도 몇 초 안에 반영됩니다.</div>
  </section>
  <section>
    <div class="bar">
      <div class="tabs"><button type="button" class="tab" data-tab="room">함께 채팅</button><button type="button" class="tab" data-tab="me">나만 엑사원</button></div>
      <span class="hint" id="tabHint"></span>
      <div class="sp"></div>
      <button class="ghost" id="reset" type="button">새 대화</button>
    </div>
    <div class="panel" id="roomPanel">
      <div id="rlog"></div>
      <form id="rf">
        <div class="callers"><span>AI 부르기</span><button type="button" data-call="@엑사원 ">@엑사원</button></div>
        <textarea id="rq" rows="1" placeholder="모두에게 보내기 (Enter) · @엑사원을 붙이면 AI가 답해요"></textarea>
        <button class="btn" id="rgo">보내기</button>
      </form>
    </div>
    <div class="panel" id="mePanel">
    <div id="log"></div>
    <form id="f">
      <div id="att"></div>
      <button class="clip" id="clip" type="button" title="파일 첨부 (PDF·워드·엑셀·텍스트, 5MB까지. 엑사원은 글만 읽어요)">📎</button>
      <input type="file" id="file" multiple hidden accept="application/pdf,.pdf,.docx,.xlsx,.xls,.txt,.md,.csv,.json,.tex,.html">
      <textarea id="q" rows="1" placeholder="무엇이든 물어보세요 (Enter 보내기 · 📎 파일 첨부)"></textarea>
      <button class="btn" id="go">보내기</button>
    </form>
    </div>
  </section>
</main>
<script src="/corner/vendor/diff_match_patch.js"></script>
<script src="/corner/vendor/marked.min.js"></script>
<script src="/corner/vendor/purify.min.js"></script>
<script src="/corner/vendor/mammoth.browser.min.js" defer></script>
<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const nameEl = $("#name");
nameEl.value = store.get("corner.name", "");
nameEl.addEventListener("input", () => store.set("corner.name", nameEl.value.trim()));
const myName = () => nameEl.value.trim() || "익명";

/* ---------------- 회의록: 함께 고치기 ---------------- */
const dmp = new diff_match_patch();
const ta = $("#minutes");
let base = null;            // 서버에서 마지막으로 받은 판 {id, body}
let saving = false, saveTimer = null, dirty = false, pollTimer = null;
const timeOf = t => t ? new Date(t).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) : "";

function status(kind, text) { $("#dot").className = "dot " + kind; $("#st").textContent = text; }
function lastEdit(row) { if (row && row.author) $("#foot").textContent = `마지막 수정: ${row.author} · ${timeOf(row.created_at)}  —  고친 내용은 자동 저장되고, 다른 사람 화면에도 몇 초 안에 반영됩니다.`; }

// 커서 위치를 지키면서 글 바꾸기
function setText(next) {
  const prev = ta.value;
  if (prev === next) return;
  const focused = document.activeElement === ta;
  const s = ta.selectionStart, e = ta.selectionEnd, top = ta.scrollTop;
  const diffs = dmp.diff_main(prev, next);
  ta.value = next;
  if (focused) { ta.setSelectionRange(dmp.diff_xIndex(diffs, s), dmp.diff_xIndex(diffs, e)); }
  ta.scrollTop = top;
}

// 내가 고친 것(base→지금)을 새 판 위에 얹기
function rebase(row) {
  const mine = ta.value;
  let merged = row.body;
  if (base && mine !== base.body) {
    const patches = dmp.patch_make(base.body, mine);
    merged = dmp.patch_apply(patches, row.body)[0];
  }
  base = { id: row.id, body: row.body };
  setText(merged);
  lastEdit(row);
  if (merged !== row.body) { dirty = true; scheduleSave(300); }
}

async function poll() {
  clearTimeout(pollTimer);
  try {
    const r = await fetch("/api/corner-minutes" + (base ? "?after=" + base.id : ""), { cache: "no-store" });
    if (r.status === 503) { status("err", "저장소 연결 전"); ta.disabled = true; return; }
    if (!r.ok) throw new Error(r.status);
    const row = await r.json();
    if (!base) { base = { id: row.id, body: row.body }; ta.value = row.body; ta.disabled = false; lastEdit(row); }
    else if (!row.same && row.id !== base.id && !saving) rebase(row);
    if (!saving && !dirty) status("ok", "실시간 연결됨");
  } catch { status("err", "연결이 잠시 끊겼어요. 다시 시도 중…"); }
  pollTimer = setTimeout(poll, document.hidden ? 8000 : 2500);
}

function scheduleSave(ms = 1000) { clearTimeout(saveTimer); saveTimer = setTimeout(save, ms); }
async function save() {
  if (saving || !base) return;
  if (ta.value === base.body) { dirty = false; status("ok", "저장됨"); return; }
  saving = true; status("busy", "저장 중…");
  const body = ta.value;
  try {
    const r = await fetch("/api/corner-minutes", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ base_id: base.id, body, author: myName() }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 409 && j.latest) { saving = false; rebase(j.latest); return; }
    if (!r.ok) throw new Error(j.error || r.status);
    base = { id: j.id, body };
    lastEdit({ author: j.author, created_at: j.created_at });
    saving = false;
    if (ta.value !== body) scheduleSave(); else { dirty = false; status("ok", "저장됨"); }
  } catch (e) {
    saving = false; status("err", "저장 실패, 다시 시도할게요");
    scheduleSave(4000);
  }
}
ta.addEventListener("input", () => { dirty = true; status("busy", "고치는 중…"); scheduleSave(); });
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
poll();

/* ---------------- 챗봇: 각자 따로 ---------------- */
const log = $("#log"), q = $("#q"), go = $("#go");
let history = store.get("corner.chat", []);
let busy = false;
const md = t => DOMPurify.sanitize(marked.parse(t, { breaks: true }));
const SAMPLES = ["중학 수학 교재 코너명을 지을 때 좋은 기준을 알려줘", "'개념 확인' 같은 코너명을 더 재미있게 10개 바꿔 줘", "이 문장을 중학생 눈높이로 다듬어 줘"];

function render() {
  log.innerHTML = "";
  if (!history.length) {
    log.innerHTML = `<div class="empty"><b>엑사원에게 자유롭게 물어보세요</b>이 대화는 나만 보이고, 회의록과 연결되지 않아요.<br>회의록 내용을 쓰고 싶으면 복사해서 붙여 넣으세요.<div class="chips"></div></div>`;
    const chips = log.querySelector(".chips");
    SAMPLES.forEach(s => { const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = () => { q.value = s; q.focus(); }; chips.appendChild(b); });
    return;
  }
  history.forEach(m => add(m.role, m.show ?? m.content, m.names));
}
function add(role, text, names) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot");
  if (role === "user") {
    if (names && names.length) {
      const c = document.createElement("div"); c.className = "chips2";
      names.forEach(n => { const x = document.createElement("span"); x.className = "chip"; x.textContent = "📄 " + n; c.appendChild(x); });
      d.appendChild(c);
    }
    d.appendChild(document.createTextNode(text));
  } else { d.innerHTML = md(text); tools(d, text); }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function tools(d, text) {
  const t = document.createElement("div"); t.className = "tools";
  const b = document.createElement("button"); b.type = "button"; b.textContent = "복사";
  b.onclick = async () => { try { await navigator.clipboard.writeText(text); b.textContent = "복사됨"; setTimeout(() => b.textContent = "복사", 1200); } catch {} };
  t.appendChild(b); d.appendChild(t);
}
const ERR = { ip: "잠시 질문이 많았어요. 몇 분 뒤 다시 해 주세요.", daily: "오늘 쓸 수 있는 양을 다 썼어요. 내일 다시 써 주세요.", no_key: "아직 엑사원 연결(API 키)이 안 되어 있어요.", bad_messages: "대화가 너무 길어요. '새 대화'를 눌러 주세요." };

async function ask(text) {
  if (busy) return;
  const atts = pending.slice();
  if (!text.trim()) text = "첨부한 파일을 살펴봐 줘.";
  busy = true; go.disabled = true;
  if (!history.length) log.innerHTML = "";
  const texts = atts.filter(a => a.kind === "text").map(a => `\n\n[첨부 파일: ${a.name}]\n${a.text}`).join("");
  const msg = { role: "user", content: text + texts, show: text, names: atts.map(a => a.name) };
  history.push(msg);
  pending = []; drawAtt();
  add("user", text, msg.names);
  const d = add("assistant", ""); d.innerHTML = '<span class="wait">생각하는 중…</span>';
  let out = "";
  try {
    const r = await fetch("/api/corner-chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ messages: history.slice(-30).map(m => ({ role: m.role, content: m.content })) }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(ERR[j.error] || "답을 받지 못했어요. 잠시 뒤 다시 해 주세요."); }
    const rd = r.body.getReader(), dec = new TextDecoder();
    let last = 0;
    for (;;) {
      const { value, done } = await rd.read();
      if (done) break;
      out += dec.decode(value, { stream: true });
      if (Date.now() - last > 80) { d.innerHTML = md(out.replace("[[ERROR]]", "")); log.scrollTop = log.scrollHeight; last = Date.now(); }
    }
    if (out.includes("[[ERROR]]")) { out = out.replace("[[ERROR]]", "").trim(); if (!out) throw new Error("답을 받지 못했어요. 잠시 뒤 다시 해 주세요."); out += "\n\n(중간에 끊겼어요.)"; }
    d.innerHTML = md(out); tools(d, out);
    history.push({ role: "assistant", content: out });
    store.set("corner.chat", history);
  } catch (e) {
    history.pop();
    d.innerHTML = ""; const w = document.createElement("span"); w.className = "wait"; w.textContent = e.message; d.appendChild(w);
    q.value = msg.show; pending = atts; drawAtt();
  }
  busy = false; go.disabled = false; log.scrollTop = log.scrollHeight;
}
$("#f").addEventListener("submit", e => {
  e.preventDefault(); const t = q.value;
  if (busy) return;
  if (pending.some(a => a.busy)) { flash("파일을 올리는 중이에요. 잠시만요."); return; }
  if (!t.trim() && !pending.length) return;
  q.value = ""; grow(); ask(t);
});
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#f").requestSubmit(); } });
const grow = () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 180) + "px"; };
q.addEventListener("input", grow);
$("#reset").onclick = () => { if (busy) return; history = []; pending = []; drawAtt(); store.set("corner.chat", history); render(); };

/* ---------- 파일 첨부 ---------- */
// PDF·워드·엑셀·텍스트는 브라우저에서 글자만 뽑아 질문에 붙임 (엑사원은 글만 읽음)
let pending = [];
const att = $("#att"), fileEl = $("#file");
const TEXT_EXT = /\.(txt|md|csv|json|tex|html?)$/i;
const MAX_FILE = 5 * 1024 * 1024, MAX_TEXT = 150_000;
const cut = t => t.length > MAX_TEXT ? t.slice(0, MAX_TEXT) + "\n…(파일이 길어 앞부분만 보냄)" : t;
const loaded = {};
const need = (src, test) => test() ? Promise.resolve() : (loaded[src] ||= new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = () => { delete loaded[src]; no(new Error("읽기 도구를 불러오지 못했어요.")); }; document.head.appendChild(sc); }));
// PDF는 글자만 뽑아서 붙임 (엑사원은 글만 읽음. 스캔본처럼 글자가 없는 PDF는 못 읽음)
async function pdfText(file) {
  await need("/corner/vendor/pdf.min.js", () => window.pdfjsLib);
  pdfjsLib.GlobalWorkerOptions.workerSrc = "/corner/vendor/pdf.worker.min.js";
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pages = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    let line = "", out = [];
    for (const it of tc.items) { line += it.str; if (it.hasEOL) { out.push(line); line = ""; } }
    if (line) out.push(line);
    pages.push(`[${i}쪽]\n` + out.join("\n"));
    if (pages.join("").length > MAX_TEXT) break;
  }
  const text = pages.join("\n\n");
  if (!text.replace(/\[\d+쪽\]/g, "").trim()) throw new Error("글자를 찾지 못했어요. 스캔한 PDF는 읽을 수 없어요.");
  return text;
}
function flash(m) { const w = document.createElement("div"); w.className = "msg bot"; w.innerHTML = `<span class="wait"></span>`; w.firstChild.textContent = m; log.appendChild(w); log.scrollTop = log.scrollHeight; setTimeout(() => w.remove(), 5000); }
function drawAtt() {
  att.innerHTML = "";
  pending.forEach(a => {
    const c = document.createElement("span"); c.className = "chip" + (a.busy ? " busy" : "");
    const n = document.createElement("span"); n.textContent = (a.busy ? "⏳ " : "📄 ") + a.name; c.appendChild(n);
    const x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.title = "빼기";
    x.onclick = () => { pending = pending.filter(p => p !== a); drawAtt(); };
    c.appendChild(x); att.appendChild(c);
  });
}
async function addFile(file) {
  if (pending.length >= 5) { flash("한 번에 5개까지 붙일 수 있어요."); return; }
  const a = { name: file.name || "붙여넣은 이미지.png", busy: true };
  pending.push(a); drawAtt();
  try {
    if (file.size > MAX_FILE) throw new Error("5MB까지 올릴 수 있어요.");
    if (/\.docx$/i.test(a.name)) {
      if (!window.mammoth) throw new Error("워드 읽기 준비 중이에요. 잠시 뒤 다시 해 주세요.");
      const r = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
      Object.assign(a, { kind: "text", text: cut(r.value) });
    } else if (/\.xlsx?$/i.test(a.name)) {
      await need("/corner/vendor/xlsx.full.min.js", () => window.XLSX);
      const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
      const text = wb.SheetNames.map(n => `[시트: ${n}]\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n], { blankrows: false })).join("\n\n");
      Object.assign(a, { kind: "text", text: cut(text) });
    } else if (TEXT_EXT.test(a.name) || file.type.startsWith("text/")) {
      Object.assign(a, { kind: "text", text: cut(await file.text()) });
    } else if (file.type === "application/pdf" || /\.pdf$/i.test(a.name)) {
      Object.assign(a, { kind: "text", text: cut(await pdfText(file)) });
    } else if (file.type.startsWith("image/")) {
      throw new Error("엑사원은 글만 읽을 수 있어서 이미지는 올릴 수 없어요.");
    } else throw new Error("이 형식은 아직 못 읽어요. PDF·워드·엑셀·텍스트 파일을 올려 주세요. (한글 hwp는 PDF로 저장해서 올려 주세요)");
    a.busy = false;
  } catch (e) {
    pending = pending.filter(p => p !== a);
    flash(`${a.name}: ${e.message}`);
  }
  drawAtt();
}
$("#clip").onclick = () => fileEl.click();
fileEl.onchange = () => { [...fileEl.files].forEach(addFile); fileEl.value = ""; };
q.addEventListener("paste", e => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { e.preventDefault(); fs.forEach(addFile); } });
const chatSec = $("#f").closest("section");
chatSec.addEventListener("dragover", e => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); chatSec.classList.add("drop"); } });
chatSec.addEventListener("dragleave", e => { if (!chatSec.contains(e.relatedTarget)) chatSec.classList.remove("drop"); });
chatSec.addEventListener("drop", e => { e.preventDefault(); chatSec.classList.remove("drop"); tab("me"); [...e.dataTransfer.files].forEach(addFile); });
render();

/* ---------------- 함께 채팅 (참가자 + @엑사원) ---------------- */
const rlog = $("#rlog"), rq = $("#rq"), rgo = $("#rgo");
const BOTNAME = { claude: "클로드", exaone: "엑사원" };
const BOTRE = { exaone: /@\s*(엑사원|exaone)/i };
let rows = [], lastId = 0, rTimer = null, rSending = false;
function tab(t) {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  $("#roomPanel").hidden = t !== "room"; $("#mePanel").hidden = t !== "me";
  $("#reset").hidden = t !== "me";
  $("#tabHint").textContent = t === "room" ? "모두 함께 · AI는 부를 때만 답해요" : "K-EXAONE 2.5 · 나만 보는 대화";
  store.set("corner.tab", t);
  if (t === "room") { rlog.scrollTop = rlog.scrollHeight; }
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => tab(b.dataset.tab));
tab(store.get("corner.tab", "room"));
function drawRoom() {
  const atBottom = rlog.scrollHeight - rlog.scrollTop - rlog.clientHeight < 80;
  rlog.innerHTML = "";
  if (!rows.length) rlog.innerHTML = '<div class="empty"><b>함께 쓰는 채팅방이에요</b>여기 쓴 글은 접속한 모두에게 보여요.<br>AI 의견이 필요하면 <b style="display:inline">@엑사원</b>을 붙여 부르세요.</div>';
  const me = myName();
  rows.forEach(r => {
    const d = document.createElement("div");
    d.className = "rm" + (r.bot ? " bot" : r.author === me ? " mine" : "");
    const who = document.createElement("div"); who.className = "who";
    const b = document.createElement("b"); b.textContent = r.author; who.appendChild(b);
    if (r.bot) { const g = document.createElement("span"); g.className = "badge " + r.bot; g.textContent = "AI"; who.appendChild(g); }
    who.appendChild(document.createTextNode(" " + timeOf(r.created_at)));
    const bub = document.createElement("div"); bub.className = "bub";
    if (r.bot) bub.innerHTML = md(r.body); else bub.textContent = r.body;
    d.append(who, bub); rlog.appendChild(d);
  });
  // 불렀는데 아직 답이 없는 AI 표시 (3분 안)
  const answered = new Set(rows.filter(r => r.bot).map(r => r.reply_to + ":" + r.bot));
  const waiting = new Set();
  rows.filter(r => !r.bot && Date.now() - new Date(r.created_at) < 180000).forEach(r => {
    for (const k in BOTRE) if (BOTRE[k].test(r.body) && !answered.has(r.id + ":" + k)) waiting.add(BOTNAME[k]);
  });
  if (waiting.size) { const t = document.createElement("div"); t.className = "typing"; t.textContent = [...waiting].join(", ") + "이(가) 답을 쓰는 중…"; rlog.appendChild(t); }
  if (atBottom) rlog.scrollTop = rlog.scrollHeight;
}
function addRows(list, bump = true) {
  let changed = false;
  for (const r of list || []) if (!rows.some(x => x.id === r.id)) { rows.push(r); changed = true; if (bump) lastId = Math.max(lastId, r.id); }
  if (changed) { rows.sort((a, b) => a.id - b.id); if (rows.length > 300) rows = rows.slice(-300); }
  return changed;
}
async function pollRoom() {
  clearTimeout(rTimer);
  try {
    const r = await fetch("/api/corner-room" + (lastId ? "?after=" + lastId : ""), { cache: "no-store" });
    if (r.ok) { const j = await r.json(); if (addRows(j.rows) || !lastId) drawRoom(); }
    else if (r.status === 503) rlog.innerHTML = '<div class="empty">채팅 저장소가 아직 연결되지 않았어요.</div>';
  } catch {}
  if (rows.some(r => !r.bot && Date.now() - new Date(r.created_at) < 180000)) drawRoom(); // 답 기다리는 표시 갱신
  rTimer = setTimeout(pollRoom, document.hidden ? 8000 : 2000);
}
async function sendRoom() {
  const text = rq.value.trim();
  if (!text || rSending) return;
  if (!nameEl.value.trim()) { nameEl.focus(); nameEl.placeholder = "이름을 먼저!"; return; }
  rSending = true; rgo.disabled = true; rq.value = ""; rgrow();
  const temp = { id: Number.MAX_SAFE_INTEGER, author: myName(), body: text, created_at: new Date().toISOString(), temp: true };
  rows.push(temp); drawRoom(); rlog.scrollTop = rlog.scrollHeight;
  try {
    const p = fetch("/api/corner-room", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ author: myName(), body: text }) });
    const calls = Object.keys(BOTRE).some(k => BOTRE[k].test(text));
    if (calls) { setTimeout(() => { rSending = false; rgo.disabled = false; }, 600); } // AI 답 기다리는 동안에도 계속 쓸 수 있게
    const r = await p; const j = await r.json().catch(() => ({}));
    rows = rows.filter(x => x !== temp);
    if (!r.ok) { rq.value = text; flashRoom(j.error === "too_many" ? "잠시 너무 빨리 보냈어요." : "보내지 못했어요. 다시 해 주세요."); }
    else { addRows([j.row, ...(j.replies || [])], false); pollRoom(); if (j.botError) flashRoom("AI를 너무 자주 불렀어요. 몇 분 뒤 다시 불러 주세요."); }
  } catch { rows = rows.filter(x => x !== temp); rq.value = text; flashRoom("보내지 못했어요. 다시 해 주세요."); }
  drawRoom(); rSending = false; rgo.disabled = false;
}
function flashRoom(m) { const t = document.createElement("div"); t.className = "typing"; t.textContent = m; rlog.appendChild(t); rlog.scrollTop = rlog.scrollHeight; setTimeout(() => t.remove(), 5000); }
const rgrow = () => { rq.style.height = "auto"; rq.style.height = Math.min(rq.scrollHeight, 180) + "px"; };
rq.addEventListener("input", rgrow);
$("#rf").addEventListener("submit", e => { e.preventDefault(); sendRoom(); });
rq.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendRoom(); } });
document.querySelectorAll("[data-call]").forEach(b => b.onclick = () => { const c = b.dataset.call; if (!rq.value.includes(c.trim())) rq.value = c + rq.value; rq.focus(); rgrow(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollRoom(); });
pollRoom();
</script>
